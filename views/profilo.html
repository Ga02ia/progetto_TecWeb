<!-- PROFILO SECTION -->
<section class="profile-section">
  <div class="container">
    <h1 class="profile-title">Il mio profilo</h1>

    <!-- DATI PERSONALI -->
    <div class="profile-card">
      <div class="profile-card-header">
        <h2>Informazioni personali</h2>
      </div>
      <div class="profile-card-body">
        <div class="profile-info-grid">
          <div class="profile-info-item">
            <span class="profile-info-label">Nome</span>
            <span class="profile-info-value" id="userNome">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Cognome</span>
            <span class="profile-info-value" id="userCognome">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Email</span>
            <span class="profile-info-value" id="userEmail">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Telefono</span>
            <span class="profile-info-value" id="userTelefono">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Indirizzo</span>
            <span class="profile-info-value" id="userIndirizzo">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Città</span>
            <span class="profile-info-value" id="userCitta">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Provincia</span>
            <span class="profile-info-value" id="userProvincia">-</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">CAP</span>
            <span class="profile-info-value" id="userCap">-</span>
          </div>
        </div>
      </div>
    </div>

    <!-- STORICO ORDINI -->
    <div class="profile-card">
      <div class="profile-card-header">
        <h2>I miei ordini</h2>
      </div>
      <div class="profile-card-body">
        <div id="ordersContainer">
          <div class="loading-spinner">Caricamento ordini...</div>
        </div>
      </div>
    </div>
  </div>
</section>
